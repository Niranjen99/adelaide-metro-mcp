name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest and newest supported Python on Linux.
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.13" }
          # Windows has no system timezone database, so this job checks the tzdata dependency.
          - { os: windows-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      # Tests use the small made-up fixture in tests/fixtures; no network or real data needed.
      - name: Run tests
        run: python -m pytest -v

      - name: Check the benchmark script compiles
        run: python -m py_compile benchmarks/bench_queries.py
