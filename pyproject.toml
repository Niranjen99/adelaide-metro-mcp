[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "adelaide-metro-mcp"
version = "0.1.0"
description = "MCP server that answers Adelaide Metro stop, departure and disruption questions from official GTFS data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp[cli]>=2.3,<3",
    "pydantic>=2.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
adelaide-metro-mcp = "adelaide_metro_mcp.server:main"

[tool.setuptools.packages.find]
include = ["adelaide_metro_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
